name: macOS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Core tests and macOS executable compilation
        run: swift test -j 2
      - name: Build Apple Silicon application bundle
        run: bash scripts/build-macos.sh
