name: macOS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Core tests and macOS executable compilation
        run: swift test -j 2
      - name: Build Apple Silicon application bundle
        run: bash scripts/build-macos.sh
